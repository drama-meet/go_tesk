<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2329;
    --muted: #8a9099;
    --line: #e5e7eb;
    --primary: #2f6bff;
    --primary-hover: #2559d9;
    --danger: #e5484d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, .04);
  }

  .brand {
    text-align: center;
    margin-bottom: 28px;
  }

  .brand h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 600;
  }

  .brand p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  .tabs {
    display: flex;
    gap: 8px;
    padding: 4px;
    margin-bottom: 24px;
    background: var(--bg);
    border-radius: 10px;
  }

  .tab {
    flex: 1;
    padding: 9px 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    transition: all .2s;
  }

  .tab.active {
    background: var(--card);
    color: var(--text);
    font-weight: 600;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .06);
  }

  .form { display: none; }
  .form.active { display: block; }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: var(--muted);
  }

  .field input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }

  .field input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(47, 107, 255, .12);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    font-size: 13px;
  }

  .row label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    cursor: pointer;
  }

  .row a {
    color: var(--primary);
    text-decoration: none;
  }

  .row a:hover { text-decoration: underline; }

  .submit {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }

  .submit:hover { background: var(--primary-hover); }

  .switch {
    margin: 18px 0 0;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  .switch button {
    padding: 0;
    border: 0;
    background: none;
    color: var(--primary);
    font-size: 13px;
    cursor: pointer;
  }

  .switch button:hover { text-decoration: underline; }

  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translate(-50%, -12px);
    padding: 10px 18px;
    border-radius: 8px;
    background: var(--text);
    color: #fff;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
  }

  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--danger); }

  @media (max-width: 420px) {
    .card { padding: 24px; border-radius: 12px; }
  }
</style>
</head>
<body>

<main class="card">
  <div class="brand">
    <h1>欢迎使用</h1>
    <p>登录以继续，或创建一个新账号</p>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" class="tab active" data-tab="login" role="tab">登录</button>
    <button type="button" class="tab" data-tab="register" role="tab">注册</button>
  </div>

  <!-- 登录表单 -->
  <form id="login" class="form active" novalidate>
    <div class="field">
      <label for="login-account">用户名</label>
      <input id="login-account" type="text" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="field">
      <label for="login-password">密码</label>
      <input id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <div class="row">
      <label><input type="checkbox" id="remember"> 记住我</label>
      <a href="#" onclick="toast('演示页面：暂未接入找回密码'); return false;">忘记密码？</a>
    </div>
    <button type="submit" class="submit">登录</button>
    <p class="switch">还没有账号？<button type="button" data-goto="register">立即注册</button></p>
    <p class="switch"><a href="public-links.html">浏览公开短链和热度榜</a></p>
  </form>

  <!-- 注册表单 -->
  <form id="register" class="form" novalidate>
    <div class="field">
      <label for="reg-name">用户名</label>
      <input id="reg-name" type="text" placeholder="给自己起个名字" autocomplete="nickname">
    </div>
    <div class="field">
      <label for="reg-email">邮箱</label>
      <input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="reg-password">密码</label>
      <input id="reg-password" type="password" placeholder="至少 6 位" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="reg-confirm">确认密码</label>
      <input id="reg-confirm" type="password" placeholder="再输入一次密码" autocomplete="new-password">
    </div>
    <button type="submit" class="submit">创建账号</button>
    <p class="switch">已有账号？<button type="button" data-goto="login">去登录</button></p>
  </form>
</main>

<div class="toast" id="toast"></div>

<script>
  // 登录 / 注册切换
  function switchTo(name) {
    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.classList.toggle('active', tab.dataset.tab === name);
    });
    document.querySelectorAll('.form').forEach(function (form) {
      form.classList.toggle('active', form.id === name);
    });
    document.querySelectorAll('.toast').forEach(function (t) { t.classList.remove('show'); });
  }

  document.querySelectorAll('.tab').forEach(function (tab) {
    tab.addEventListener('click', function () { switchTo(tab.dataset.tab); });
  });
  document.querySelectorAll('[data-goto]').forEach(function (btn) {
    btn.addEventListener('click', function () { switchTo(btn.dataset.goto); });
  });

  // 轻量提示
  var toastTimer;
  function toast(message, isError) {
    var el = document.getElementById('toast');
    el.textContent = message;
    el.classList.toggle('error', !!isError);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  const API = 'http://localhost:11114';

  async function postJSON(path, payload) {
    let response;
    try {
      response = await fetch(`${API}${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } catch (error) {
      throw new Error('无法连接后端，请确认服务已启动（端口 11114）');
    }

    let data;
    try {
      data = await response.json();
    } catch (error) {
      throw new Error('后端返回的数据格式不正确');
    }
    if (!response.ok) {
      throw new Error(data.error || `请求失败（${response.status}）`);
    }
    return data;
  }

  // 登录
  document.getElementById('login').addEventListener('submit', async function (e) {
    e.preventDefault();

    var account = document.getElementById('login-account').value.trim();
    var password = document.getElementById('login-password').value;

    if (!account || !password) return toast('请填写完整登录信息', true);

    var button = this.querySelector('.submit');
    button.disabled = true;
    try {
      const data = await postJSON('/login', { username: account, password });
      if (!data.token) {
        toast('登录失败：后端没有返回 token', true);
        return;
      }

      localStorage.removeItem('token');
      sessionStorage.removeItem('token');
      var storage = document.getElementById('remember').checked ? localStorage : sessionStorage;
      storage.setItem('token', data.token);
      window.location.assign(new URL('links.html', window.location.href).href);
    } catch (error) {
      toast(error.message || '登录失败', true);
    } finally {
      button.disabled = false;
    }
  });

  // 注册：校验邮箱格式、密码长度与两次一致
  document.getElementById('register').addEventListener('submit', async function (e) {
    e.preventDefault();
    var name = document.getElementById('reg-name').value.trim();
    var email = document.getElementById('reg-email').value.trim();
    var password = document.getElementById('reg-password').value;
    var confirm = document.getElementById('reg-confirm').value;

    if (!name || !email || !password) return toast('请填写完整注册信息', true);
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('邮箱格式不正确', true);
    if (password.length < 6) return toast('密码至少 6 位', true);
    if (password !== confirm) return toast('两次输入的密码不一致', true);

    var button = this.querySelector('.submit');
    button.disabled = true;
    try {
      const data = await postJSON('/register', { username: name, email: email, password: password });
      document.getElementById('register').reset();
      document.getElementById('login-account').value = name;
      switchTo('login');
      toast(data.message || '注册成功，请登录');
    } catch (error) {
      toast(error.message || '注册失败', true);
    } finally {
      button.disabled = false;
    }
  });
</script>

</body>
</html>
